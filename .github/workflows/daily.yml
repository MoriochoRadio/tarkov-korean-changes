name: 매일 타르코프 변경 해석

on:
  schedule:
    # 매일 UTC 14:23 (= 한국시간 23:23). 정각(0분)은 GitHub cron 혼잡 시간대라
    # 실제 시작이 1~2시간 지연 관측됨 — 어중간한 분으로 회피.
    - cron: "23 14 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # data/ 와 docs/ 변경을 커밋하기 위해 필요
  models: read      # (구) GitHub Models 폴백용 — Groq 이전 완료 후 제거 가능

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행 (스크래핑→해석→빌드)
        env:
          # 기본: Groq(무료 티어) — GitHub Models 가 2026-08 retirement brownout 으로
          # 410 을 반환해 이전함. GROQ_API_KEY 시크릿 등록 시 스크립트가 자동으로
          # groq 를 선택한다(키 없으면 구 github 경로 → 실패하지만 스텁 커밋은 방지).
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 다른 제공자로 바꾸고 싶을 때만 아래 Secret 을 등록하세요(선택).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PATCHNOTES_URL: ${{ vars.PATCHNOTES_URL }}
        run: python pipeline.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 일일 변경 해석 업데이트 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main  # 수동 커밋과 겹칠 때 non-fast-forward 방어
            git push
          fi
