name: 매일 타르코프 변경 해석

on:
  schedule:
    # 매일 UTC 14:23 (= 한국시간 23:23). 정각(0분)은 GitHub cron 혼잡 시간대라
    # 실제 시작이 1~2시간 지연 관측됨 — 어중간한 분으로 회피.
    - cron: "23 14 * * *"
  workflow_dispatch: {}   # 수동 실행 버튼

permissions:
  contents: write   # data/ 와 docs/ 변경을 커밋하기 위해 필요

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 체크아웃
        uses: actions/checkout@v6

      - name: 파이썬 설정
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행 (스크래핑→해석→빌드)
        env:
          # 기본: Groq(무료 티어). 모델은 실행 때마다 Groq 활성 모델 목록에서 자동 선택하므로
          # 무료 모델이 폐지돼도 코드 수정이 필요 없다. 특정 모델 고정은 Variables 의 GROQ_MODEL(선택).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # 다른 제공자로 바꾸고 싶을 때만 아래 Secret 을 등록하세요(선택).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PATCHNOTES_URL: ${{ vars.PATCHNOTES_URL }}
          # 사람 조치가 필요한 상황(키 인증 실패·쓸 수 있는 모델 없음 등)을 기록 → 마지막 단계가 판정
          ALERT_FILE: ${{ runner.temp }}/needs_human.txt
        run: python pipeline.py

      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 일일 변경 해석 업데이트 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main  # 수동 커밋과 겹칠 때 non-fast-forward 방어
            git push
          fi

      - name: 사람 조치 필요 여부 확인
        # 커밋·배포가 끝난 뒤에만 런을 실패시킨다 — 데이터는 매일 반영되고(60일 무활동으로
        # schedule 이 꺼지는 것도 방지), 사람이 봐야 할 때만 GitHub 이 소유자에게 실패 메일을 보낸다.
        # 일시 오류(429/5xx/네트워크)는 스크립트가 재시도·보류로 흡수하므로 여기 오지 않는다.
        run: |
          f="${{ runner.temp }}/needs_human.txt"
          if [ -s "$f" ]; then
            while IFS= read -r line; do
              if [ -n "$line" ]; then echo "::error::사람 조치 필요 — ${line//%/%25}"; fi
            done < "$f"
            exit 1
          fi
          echo "사람 조치 필요 없음"
